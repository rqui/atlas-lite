[package]
name = "waveshare-epd397-rust-app"
version = "1.0.0"
authors = ["Piyush Daiya"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
description = "Atlas Lite firmware for the Waveshare ESP32-S3 e-Paper 3.97 board, based on Rustmix Wave"
license = "MIT"

[[bin]]
name = "waveshare-epd397-rust-app"
harness = false

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dependencies]
anyhow = "1"
embedded-graphics = "0.8.1"
embedded-hal = "1.0"
log = "0.4"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
es8311 = "0.1.0"
critical-section = "1.2"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
